# version: '3.8'
services:
  mongodb:
    container_name: mongodb
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db # Persist MongoDB data
    # environment: other way to define env variables
    #   MONGO_INITDB_DATABASE:
    #   MONGO_INITDB_ROOT_USERNAME: 
    #   MONGO_INITDB_ROOT_PASSWORD: 
    env_file: 
      - ./backend/env/.env.production # Load environment variables from .env file  
    
  backend:
    container_name: backend
    build: ./backend # Path to your Node.js backend
    ports:
      - "1111:1111" # Or your API's port
    volumes:
      - logs:/server/logs # Mount logs directory to persist logs  
    depends_on:
      - mongodb
    env_file:
      - ./backend/env/.env.production # Load environment variables from .env file  

  webserver:
    container_name: webserver
    build: ./frontend # Use the same build context as frontend
    ports:
      - "80:80" # Expose Nginx on port 80
    depends_on:
      - backend # Nginx depends on backend to route API calls
      - mongodb # Ensure MongoDB is up for backend

# named volumes must be defined at the bottom of the file
volumes:
  mongo-data:
  logs:
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tasks
  template:
    metadata:
      labels:
        app: tasks
    spec:
      containers:
      - name: tasks
        image: raghad90/kub-demo-tasks:v7
        env:
         - name: TASKS_FOLDER
           value: tasks
        envFrom:
         - configMapRef:
            name: api-config
